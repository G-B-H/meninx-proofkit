[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meninx-proofkit"
version = "0.1.0"
description = "Deterministic SHA-256 manifests for delivery integrity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
meninx-proofkit = "meninx_proofkit.cli:main"

[tool.setuptools.packages.find]
include = ["meninx_proofkit*"]
